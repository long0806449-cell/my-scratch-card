<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上專屬刮刮樂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --gold: #ffb703;
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      user-select: none;
    }

    .card-container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .ticket-tag {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .scratch-area {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .prize-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
    }

    .prize-img {
      max-width: 85%;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .prize-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      line-height: 1.4;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
      z-index: 2;
    }

    .action-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e5a300;
    }

    /* Modal 視窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      color: #333;
      width: 100%;
      max-width: 450px;
      border-radius: 15px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .list-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.85rem;
    }

    .reset-link {
      margin-top: 15px;
      color: #888;
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle" onclick="handleTitleClick()">幸運線上刮刮樂</h1>
  </header>

  <div class="card-container">
    <div class="ticket-tag" id="ticketTag">載入中...</div>
    
    <div class="scratch-area">
      <div class="prize-layer">
        <img id="prizeImg" class="prize-img" src="" alt="獎品圖片">
        <div id="prizeTitle" class="prize-title"></div>
      </div>
      <canvas id="scratchCanvas"></canvas>
    </div>

    <button id="claimBtn" class="action-btn" style="display:none;" onclick="openClaimModal()">填寫領獎資料</button>
    <div class="reset-link" onclick="resetCurrentTicket()">重設此張卡片 (重新刮)</div>
  </div>

  <!-- 領獎資料 Modal (僅保留姓名欄) -->
  <div id="claimModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('claimModal')">&times;</span>
      <div class="modal-title">🎉 恭喜中獎！請填寫得獎人姓名</div>
      <form id="claimForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label>姓名 *</label>
          <input type="text" id="userName" required placeholder="請輸入得獎者姓名">
        </div>
        <button type="submit" class="submit-btn">確認送出領獎</button>
      </form>
    </div>
  </div>

  <!-- 主辦人專區 Modal (隱藏式) -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
      <div class="modal-title">主辦人管理後台</div>
      <button class="submit-btn" style="background:#2a9d8f; margin-bottom:15px;" onclick="copyData()">複製所有得獎名單</button>
      <button class="submit-btn" style="background:#e63946; margin-bottom:15px;" onclick="clearAllData()">清空本機所有測試紀錄</button>
      <div id="adminList"></div>
    </div>
  </div>

  <script>
    const ticketsData = {
      "1": { name: "(1) 寶瑞葉黃素 1罐", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8B%E5%AF%B6%E7%91%9E%E8%91%89%E9%BB%83%E7%B4%A0.png" },
      "2": { name: "(2) LE BORN靜謐森林護手霜 / 旅行沐浴組", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8BLE%20BORN%E8%AD%B7%E6%89%8B%E9%9C%9C.jpg" },
      "3": { name: "(3) Taiwolf Classic 束口袋 / Good Night Spray 晚安睡眠噴霧", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8BTaiwolf%20Classic%20%E6%9D%9F%E5%8F%A3%E8%A2%8B(%E5%8F%B0%E7%81%A3%E8%A3%BD%E9%80%A0)%20Good%20Night%20Spray%20%E6%99%9A%E5%AE%89%E7%9D%A1%E7%9C%A0%E5%99%B4%E9%9C%A7.jpg" },
      "4": { name: "(4) 味全龍披巾 / 檜沐先生萬用雙效洗滌露隨身瓶", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8B%E5%91%B3%E5%85%A8%E9%BE%8D%E6%8A%AB%E5%B7%BE%E6%AA%9C%E6%B2%90%E5%85%88%E7%94%9F%E8%90%AC%E7%94%A8%E9%9B%99%E6%95%88%E6%B4%97%E6%BB%A4%E9%9C%A7.jpg" },
      "5": { name: "(5) 雅聞大馬士革玫瑰慕絲 / 霓淨思面膜 5片", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8B%E9%9B%85%E8%81%9E%E5%A4%A7%E9%A6%AC%E5%A3%AB%E9%9D%A9%E Rose%E6%B0%A8%E5%9F%BA%E9%85%B8%E6%B7%A8%E7%99%BD%E6%B4%97%E5%8D%B8%E4%BA%8C%E7%94%A8%E6%85%95%E7%B5%B2%20%E9%9C%85%E6%B7%A8%E6%80%9D%E7%8E%BB%E5%B0%BF%E9%85%B8%E4%BF%9D%E6%BF%9F%E6%B0%B4%E5%B9%B3%E8%A1%A1%E8%B3%A6%E8%83%BD%E9%9D%A2%E8%86%9C.jpg" },
      "6": { name: "(6) 義美生技高蛋白 1盒 (名額A)", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8B%E7%BE%A9%E7%BE%8E%E7%94%9F%E6%8A%80%E9%AB%98%E8%9B%8B%E7%99%BD.png" },
      "7": { name: "(7) 義美生技高蛋白 1盒 (名額B)", img: "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/%E2%80%8B%E7%BE%A9%E7%BE%8E%E7%94%9F%E6%8A%80%E9%AB%98%E8%9B%8B%E7%99%BD.png" }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let currentTicket = urlParams.get('ticket') || "1";
    let isAdminParam = urlParams.get('admin');

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let isScratchedEnough = false;
    let titleClickCount = 0;
    let titleClickTimer = null;

    function init() {
      const ticketInfo = ticketsData[currentTicket] || ticketsData["1"];
      document.getElementById('ticketTag').innerText = `專屬刮刮卡 - 第 ${currentTicket} 張`;
      document.getElementById('prizeTitle').innerText = ticketInfo.name;
      document.getElementById('prizeImg').src = ticketInfo.img;

      if (isAdminParam === 'true') {
        openAdminModal();
      }

      const savedData = localStorage.getItem(`scratch_ticket_${currentTicket}`);
      if (savedData) {
        showCompletedState(JSON.parse(savedData));
      } else {
        setupCanvas();
      }
    }

    // 連點標題 3 次解鎖主辦人專區
    function handleTitleClick() {
      titleClickCount++;
      clearTimeout(titleClickTimer);
      if (titleClickCount >= 3) {
        openAdminModal();
        titleClickCount = 0;
      } else {
        titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
      }
    }

    function setupCanvas() {
      canvas.width = 300;
      canvas.height = 300;
      canvas.style.display = 'block';
      document.getElementById('claimBtn').style.display = 'none';
      isScratchedEnough = false;

      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#666';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('刮開銀漆 揭曉獎項', 150, 150);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function scratch(e) {
      if (!isDrawing || isScratchedEnough) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
      ctx.fill();

      checkScratchPercentage();
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('touchmove', scratch);
    canvas.addEventListener('touchend', () => isDrawing = false);

    function checkScratchPercentage() {
      if (isScratchedEnough) return;
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      let clearCount = 0;

      for (let i = 3; i < pixels.length; i += 4) {
        if (pixels[i] === 0) clearCount++;
      }

      if (clearCount / (pixels.length / 4) > 0.35) {
        isScratchedEnough = true;
        canvas.style.display = 'none';
        document.getElementById('claimBtn').style.display = 'block';
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      }
    }

    function openClaimModal() { document.getElementById('claimModal').style.display = 'flex'; }
    function openAdminModal() { 
      renderAdminList();
      document.getElementById('adminModal').style.display = 'flex'; 
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function handleFormSubmit(e) {
      e.preventDefault();
      const formData = {
        ticket: currentTicket,
        prize: ticketsData[currentTicket].name,
        name: document.getElementById('userName').value,
        time: new Date().toLocaleString()
      };

      localStorage.setItem(`scratch_ticket_${currentTicket}`, JSON.stringify(formData));
      closeModal('claimModal');
      showCompletedState(formData);
      alert('領獎資料已順利送出！');
    }

    function showCompletedState(data) {
      canvas.style.display = 'none';
      const btn = document.getElementById('claimBtn');
      btn.style.display = 'block';
      btn.style.background = '#2a9d8f';
      btn.innerText = `已完成領獎 (${data.name})`;
      btn.onclick = () => {
        alert(`【領獎資料】\n得獎人姓名：${data.name}\n登記時間：${data.time}`);
      };
    }

    function resetCurrentTicket() {
      if (confirm(`確定要重設第 ${currentTicket} 張卡片嗎？這將清空此卡片的領獎紀錄。`)) {
        localStorage.removeItem(`scratch_ticket_${currentTicket}`);
        location.reload();
      }
    }

    function renderAdminList() {
      const container = document.getElementById('adminList');
      container.innerHTML = '';
      for (let i = 1; i <= 7; i++) {
        const data = localStorage.getItem(`scratch_ticket_${i}`);
        const div = document.createElement('div');
        div.className = 'list-item';
        if (data) {
          const item = JSON.parse(data);
          div.innerHTML = `<strong>卡片 ${i} (已領獎)</strong><br>獎項：${item.prize}<br>得獎人：${item.name}<br>時間：${item.time}`;
        } else {
          div.innerHTML = `<strong>卡片 ${i}</strong>：尚未刮開 / 尚無領獎紀錄`;
        }
        container.appendChild(div);
      }
    }

    function copyData() {
      let result = "【刮刮樂得獎總名單】\n\n";
      for (let i = 1; i <= 7; i++) {
        const data = localStorage.getItem(`scratch_ticket_${i}`);
        if (data) {
          const item = JSON.parse(data);
          result += `[卡號 ${i}] ${item.prize}\n得獎人：${item.name}\n時間：${item.time}\n------------------\n`;
        } else {
          result += `[卡號 ${i}] 未領獎\n------------------\n`;
        }
      }
      navigator.clipboard.writeText(result).then(() => alert('已複製所有得獎名單至剪貼簿！'));
    }

    function clearAllData() {
      if (confirm('確定要清空這台電腦上的所有測試資料嗎？')) {
        for (let i = 1; i <= 7; i++) {
          localStorage.removeItem(`scratch_ticket_${i}`);
        }
        location.reload();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
