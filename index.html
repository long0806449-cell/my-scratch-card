<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上專屬刮刮樂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --gold: #ffb703;
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .admin-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.8rem;
      cursor: pointer;
      z-index: 10;
    }

    .card-container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .ticket-tag {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .scratch-area {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .prize-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
    }

    .prize-img {
      max-width: 85%;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .prize-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      line-height: 1.4;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
      z-index: 2;
    }

    .action-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e5a300;
    }

    /* Modal 視窗 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      color: #333;
      width: 100%;
      max-width: 450px;
      border-radius: 15px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }
