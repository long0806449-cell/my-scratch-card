<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上專屬刮刮樂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --gold: #ffb703;
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      user-select: none;
    }

    .card-container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .ticket-tag {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .scratch-area {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      background: #fff;
    }

    .prize-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
      z-index: 1;
    }

    .prize-img {
      max-width: 85%;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .prize-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      line-height: 1.4;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
      z-index: 10;
    }

    .action-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e5a300;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      color: #333;
      width: 100%;
      max-width: 450px;
      border-radius: 15px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .list-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.85rem;
    }

    .reset-link {
      margin-top: 15px;
      color: #888;
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle" onclick="handleTitleClick()">幸運線上刮刮樂</h1>
  </header>

  <div class="card-container">
    <div class="ticket-tag" id="ticketTag">載入中...</div>
    
    <div class="scratch-area">
      <div class="prize-layer">
        <img id="prizeImg" class="prize-img" src="" alt="獎品圖片">
        <div id="prizeTitle" class="prize-title"></div>
      </div>
      <canvas id="scratchCanvas"></canvas>
    </div>

    <button id="claimBtn" class="action-btn" style="display:none;" onclick="openClaimModal()">填寫領獎姓名</button>
    <div class="reset-link" onclick="resetCurrentTicket()">重設此張卡片 (重新刮)</div>
  </div>

  <!-- 領獎資料 Modal -->
  <div id="claimModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('claimModal')">&times;</span>
      <div class="modal-title">🎉 恭喜中獎！請填寫領獎資料</div>
      <form id="claimForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label>得獎人姓名 *</label>
          <input type="text" id="userName" required placeholder="請輸入您的姓名">
        </div>
        <button type="submit" class="submit-btn">確認送出領獎</button>
      </form>
    </div>
  </div>

  <!-- 主辦人專區 Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
      <div class="modal-title">主辦人管理後台</div>
      <button class="submit-btn" style="background:#2a9d8f; margin-bottom:15px;" onclick="copyData()">複製所有得獎名單</button>
      <button class="submit-btn" style="background:#e63946; margin-bottom:15px;" onclick="clearAllData()">清空本機所有測試紀錄</button>
      <div id="adminList"></div>
    </div>
  </div>

  <script>
    const rawBase = "https://raw.githubusercontent.com/long0806449-cell/my-scratch-card/main/";

    const ticketsData = {
      "1": { name: "(1) 寶瑞葉黃素 1罐", img: rawBase + encodeURIComponent("​寶瑞葉黃素.png") },
      "2": { name: "(2) LE BORN靜謐森林護手霜 / 旅行沐浴組", img: rawBase + encodeURIComponent("​LE BORN護手霜.jpg") },
      "3": { name: "(3) Taiwolf Classic 束口袋 / Good Night Spray 晚安睡眠噴霧", img: rawBase + encodeURIComponent("​Taiwolf Classic 束口袋(台灣製造) Good Night Spray 晚安睡眠噴霧.jpg") },
      "4": { name: "(4) 味全龍披巾 / 檜沐先生萬用雙效洗滌露隨身瓶", img: rawBase + encodeURIComponent("​味全龍披巾檜沐先生萬用雙效洗滌露.jpg") },
      "5": { name: "(5) 雅聞大馬士革玫瑰慕絲 / 霓淨思面膜 5片", img: rawBase + encodeURIComponent("​雅聞大馬士革玫瑰氨基酸淨白洗卸二用慕絲 霓淨思玻尿酸保濕水平衡賦能面膜.jpg") },
      "6": { name: "(6) 義美生技高蛋白 1盒 (名額A)", img: rawBase + encodeURIComponent("​義美生技高蛋白.png") },
      "7": { name: "(7) 義美生技高蛋白 1盒 (名額B)", img: rawBase + encodeURIComponent("​義美生技高蛋白.png") }
    };

    const urlParams = new URLSearchParams(window.location.search);
    let currentTicket = urlParams.get('ticket') || "1";
    let isAdminParam = urlParams.get('admin');

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let isScratchedEnough = false;
    let titleClickCount = 0;
    let titleClickTimer = null;

    function init() {
      const ticketInfo = ticketsData[currentTicket] || ticketsData["1"];
      document.getElementById('ticketTag').innerText = `專屬刮刮卡 - 第 ${currentTicket} 張`;
      document.getElementById('prizeTitle').innerText = ticketInfo.name;
      
      const imgElem = document.getElementById('prizeImg');
      imgElem.src = ticketInfo.img;

      if (isAdminParam === 'true') {
        openAdminModal();
      }

      const savedData = localStorage.getItem(`scratch_ticket_${currentTicket}`);
      if (savedData) {
        showCompletedState(JSON.parse(savedData));
      } else {
        setupCanvas();
      }
    }

    function handleTitleClick() {
      titleClickCount++;
      clearTimeout(titleClickTimer);
      if (titleClickCount >= 3) {
        openAdminModal();
        titleClickCount = 0;
      } else {
        titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
      }
    }

    function setupCanvas() {
      canvas.width = 300;
      canvas.height = 300;
      canvas.style.display = 'block';
      document.getElementById('claimBtn').style.display = 'none';
      isScratchedEnough = false;

      // 重新覆蓋銀灰色塗層
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 繪製塗層上的文字
      ctx.fillStyle = '#555555';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('刮開銀漆 揭曉獎項', 150, 150);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function scratch(e) {
      if (!isDrawing || isScratchedEnough) return;
      e.preventDefault();
      const pos = getPos(e);

      // 刮除銀漆動作
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
      ctx.fill();

      checkScratchPercentage();
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('touchmove', scratch);
    canvas.addEventListener('touchend', () => isDrawing = false);

    function checkScratchPercentage() {
      if (isScratchedEnough) return;
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels =
