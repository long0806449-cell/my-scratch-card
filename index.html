<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上專屬刮刮樂</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #e63946;
      --primary-dark: #c1121f;
      --gold: #ffb703;
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 500px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      user-select: none;
    }

    .card-container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid var(--gold);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .ticket-tag {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .scratch-area {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      background: #fff;
    }

    .prize-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      text-align: center;
      z-index: 1;
    }

    .prize-img {
      max-width: 85%;
      max-height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .prize-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-dark);
      line-height: 1.4;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
      z-index: 10;
    }

    .action-btn {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e5a300;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      color: #333;
      width: 100%;
      max-width: 450px;
      border-radius: 15px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-title {
      font-size: 1.3rem;
      color: var(--primary);
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    .list-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
      font-size: 0.85rem;
    }

    .reset-link {
      margin-top: 15px;
      color: #888;
      font-size: 0.8rem;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="headerTitle" onclick="handleTitleClick()">幸運線上刮刮樂</h1>
  </header>

  <div class="card-container">
    <div class="ticket-tag" id="ticketTag">載入中...</div>
    
    <div class="scratch-area">
      <div class="prize-layer">
        <img id="prizeImg" class="prize-img" src="" alt="獎品圖片">
        <div id="prizeTitle" class="prize-title"></div>
      </div>
      <canvas id="scratchCanvas"></canvas>
    </div>

    <button id="claimBtn" class="action-btn" style="display:none;" onclick="openClaimModal()">填寫領獎姓名</button>
    <div class="reset-link" onclick="resetCurrentTicket()">重設此張卡片 (重新刮)</div>
  </div>

  <!-- 領獎資料 Modal -->
  <div id="claimModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('claimModal')">&times;</span>
      <div class="modal-title">🎉 恭喜中獎！請填寫領獎資料</div>
      <form id="claimForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label>得獎人姓名 *</label>
          <input type="text" id="userName" required placeholder="請輸入您的姓名">
        </div>
        <button type="submit" class="submit-btn">確認送出領獎</button>
      </form>
    </div>
  </div>

  <!-- 主辦人專區 Modal -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('adminModal')">&times;</span>
      <div class="modal-title">主辦人管理後台</div>
      <button class="submit-btn" style="background:#2a9d8f; margin-bottom:15px;" onclick="copyData()">複製所有得獎名單</button>
      <button class="submit-btn" style="background:#e63946; margin-bottom:15px;" onclick="clearAllData()">清空本機所有測試紀錄</button>
      <div id="adminList"></div>
    </div>
  </div>
